[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-excel"
version = "1.0.0"
description = "Local document OCR, human verification and safe Excel contracts"
requires-python = ">=3.12,<3.15"
dependencies = [
  "PySide6-Essentials>=6.8,<7", "pytesseract>=0.3.13,<0.4", "opencv-contrib-python==4.10.0.84",
  "Pillow>=11,<13", "numpy>=2,<3", "openpyxl>=3.1.5,<4", "pydantic>=2.10,<3"
]

[project.optional-dependencies]
rapid = ["rapidocr==3.8.1", "onnxruntime==1.23.2", "omegaconf==2.4.0", "opencv-python==4.10.0.84", "psutil>=6,<8"]
paddle = ["paddleocr==3.7.0", "paddlepaddle==3.3.1", "paddlex[ocr]==3.7.2", "psutil>=6,<8"]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pytest-cov>=6,<8", "ruff>=0.9", "mypy>=1.14", "types-openpyxl", "pyinstaller>=6.16,<7"]

[project.scripts]
document-excel = "document_excel.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_excel = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["ocr: requires a real Tesseract engine and installed language", "paddle: requires the local Paddle runtime and DOCUMENT_EXCEL_PADDLE_MODELS"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.extend-per-file-ignores]
"src/document_excel/presentation/widgets.py" = ["B008"]
"scripts/smoke_gui.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["src/document_excel/domain", "src/document_excel/infrastructure", "src/document_excel/application"]
check_untyped_defs = true
ignore_missing_imports = true
